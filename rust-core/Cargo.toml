[package]
name = "rustdisk_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]
name = "rustdisk_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
blake3 = "1.5"
libc = "0.2"
jwalk = "0.8"
serde_json = "1.0"
rayon = "1.10"
thiserror = "1.0"
trash = "5.1"
uniffi = { version = "0.28.3", features = ["cli"] }

[dev-dependencies]
filetime = "0.2"
